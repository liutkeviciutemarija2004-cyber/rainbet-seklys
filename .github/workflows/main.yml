name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev
        pip install "buildozer==1.5.0" cython

    - name: Create Configuration
      run: |
        buildozer init
        sed -i 's/^title =.*/title = Rainbet Seklys/' buildozer.spec
        sed -i 's/^package.name =.*/package.name = rainbetseklys/' buildozer.spec
        sed -i 's/^requirements =.*/requirements = python3/' buildozer.spec
        sed -i 's/^#android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/^#android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#android.minapi =.*/android.minapi = 21/' buildozer.spec
        sed -i 's/^#android.ndk_api =.*/android.ndk_api = 21/' buildozer.spec

    - name: Build with Buildozer
      run: buildozer android debug

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: Rainbet-Seklys-Programele
        path: bin/*.apk
