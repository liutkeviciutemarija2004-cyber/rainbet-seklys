import time
import requests
from datetime import datetime

CHANNELS = {
    "Rainbet Telegram": "https://t.me",
    "Rainbet X (Twitter)": "https://rss.app",
    "Rainbet Discord": "https://discord.com"
}

processed_items = set()

print("=" * 65)
print("🚀 MULTI-PLATFORM RAINBET MONITOR ACTIVE (24/7)")
print("Monitoring: Telegram, X (Twitter), Discord")
print("=" * 65)

def get_category_and_color(text):
    t = text.lower()
    
    requires_deposit = True
    if "no deposit" in t or "be depozito" in t or "free claim" in t or "no-dep" in t or "free balance" in t:
        requires_deposit = False
        
    new_users = False
    if "new user" in t or "new players" in t or "naujiems" in t or "welcome" in t or "sign up" in t:
        new_users = True

    if not requires_deposit and new_users:
        return "NEMOKAMI SUKIMAI BE DEPOZITO NAUJIEMS NARIAMS", "\033[91m"
    elif not requires_deposit and not new_users:
        return "NEMOKAMI SUKIMAI BE DEPOZITO ESAMIEMS NARIAMS", "\033[95m"
    elif requires_deposit and new_users:
        return "NEMOKAMI SUKIMAI REIKALAUJANTIS DEPOZITO NAUJIEMS NARIAMS", "\033[92m"
    else:
        return "NEMOKAMI SUKIMAI REIKALAUJANTIS DEPOZITO ESAMIEMS NARIAMS", "\033[93m"

def check_sources():
    timestamp = datetime.now().strftime('%H:%M:%S')
    
    for source, url in CHANNELS.items():
        try:
            if "example_" in url:
                simulate_live_stream(source, timestamp)
                continue
                
            response = requests.get(url, timeout=5)
            if response.status_code == 200:
                text = response.text
                if any(keyword in text.lower() for keyword in ["code", "promo", "drop", "free"]):
                    category, color_code = get_category_and_color(text)
                    print(f"[{timestamp}] 🚨 NEW POST DETECTED ON {source}!")
                    print(f"CATEGORY: {color_code}{category}\033[0m")
                    print("-" * 65)
        except Exception:
            pass

def simulate_live_stream(source, timestamp):
    if int(time.time()) % 15 == 0:
        if source == "Rainbet Telegram":
            text = "New Promo Drop for active players! Use code RAIN-TELE-FREE. No deposit required!"
        elif source == "Rainbet X (Twitter)":
            text = "Welcome Pack updated! Deposit 10$ and use bonus code 'WELCOME-TWITTER' to get 100 Free Spins on sign up."
        else:
            text = "Discord Exclusive Giveaway! Wager 50$ this week and claim code 'DISC-RELOAD-99'."
            
        category, color_code = get_category_and_color(text)
        print(f"[{timestamp}] 🚨 NEW POST DETECTED ({source}):")
        print(f"Content: {text}")
        print(f"CATEGORY: {color_code}{category}\033[0m")
        print("-" * 65)

if __name__ == "__main__":
    while True:
        check_sources()
        time.sleep(10)
